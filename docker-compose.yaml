# nginx proxy address - http://172.17.0.1:8093

name: openedx
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "1"

services:
  openedx:
    image: openedx/edx-platform:latest
    pull_policy: always
    container_name: openedx-app
    restart: always
    logging: *default-logging
    networks:
      - openedx
      - proxy
      - cloudflare
    ports:
      - "172.17.0.1:8093:8000"
    environment:
      TZ: ${TZ:-America/New_York}
      LMS_CFG: /config/lms.yml
      MONGODB_HOST: openedx-db
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${DB_CREATE_DATABASE_NAME:-openedx}
      MONGODB_USER: ${DB_USER_NAME:-openedx}
      MONGODB_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      DJANGO_SETTINGS_MODULE: lms.envs.production
      DJANGO_SECRET_KEY: ${APP_SECRET_KEY:-changeme_secret_key_min_32_chars}
      CONTAINER_NAME: openedx-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    volumes:
      - ./volumes/data/openedx:/data
      - ./volumes/config/openedx:/config
    depends_on:
      - openedx-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://openedx-app:8000'
      - 'cloudflare.hostname=openedx.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.openedx-app.entrypoints=http'
      - 'traefik.http.routers.openedx-app-secure.tls=true'
      - 'traefik.http.routers.openedx-app.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.openedx-app-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.openedx-app.middlewares=openedx-app-https-redirect'
      - 'traefik.http.routers.openedx-app-secure.entrypoints=https'
      - 'traefik.http.routers.openedx-app-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.openedx-app-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.openedx-app-secure.service=openedx-app'
      - 'traefik.http.services.openedx-app.loadbalancer.server.port=8000'

  openedx-db:
    image: mongo:latest
    pull_policy: always
    container_name: openedx-db
    restart: always
    logging: *default-logging
    networks:
      - openedx
    environment:
      TZ: ${TZ:-America/New_York}
      MONGO_INITDB_DATABASE: ${DB_CREATE_DATABASE_NAME:-openedx}
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER_NAME:-openedx}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      CONTAINER_NAME: openedx-db
    volumes:
      - ./volumes/data/db/mongodb/openedx:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  openedx:
    external: false
  proxy:
    external: true
  cloudflare:
    external: true
