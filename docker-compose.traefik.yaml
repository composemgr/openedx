name: openedx
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  server:
    image: openedx/edx-platform:latest
    container_name: openedx-server
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: openedx-server
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DJANGO_SETTINGS_MODULE: lms.envs.production
      SERVICE_VARIANT: lms
      LMS_ROOT_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      CMS_ROOT_URL: https://${BASE_HOST_NAME:-$HOSTNAME}
      # Runtime
      NO_PYTHON_UNINSTALL: "1"
      UWSGI_WORKERS: ${UWSGI_WORKERS:-2}
      UWSGI_THREADS: ${UWSGI_THREADS:-4}
      # Mongo
      MONGO_USERNAME: ${DB_USER_NAME:-openedx}
      MONGO_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MONGO_DB_NAME: ${DB_CREATE_DATABASE_NAME:-openedx}
      # Mysql
      MYSQL_USERNAME: ${DB_USER_NAME:-openedx}
      MYSQL_PASSWORD: ${DB_USER_PASS:-changeme_db_password}
      MYSQL_DATABASE: ${DB_CREATE_DATABASE_NAME:-openedx}
      # Email
      SMTP_HOST: ${EMAIL_SERVER_HOST:-172.17.0.1}
      SMTP_PORT: ${EMAIL_SERVER_PORT:-587}
      SMTP_USERNAME: ${EMAIL_SERVER_LOGIN_NAME:-}
      SMTP_PASSWORD: ${EMAIL_SERVER_LOGIN_PASS:-}
      SMTP_USE_TLS: "true"
      # Site branding
      SITE_NAME: ${APP_ORG_NAME:-Open edX}
      PLATFORM_NAME: ${APP_ORG_NAME:-Open edX}
      LANGUAGES: ${LANGUAGES:-en}
      DEFAULT_LANGUAGE: ${DEFAULT_LANGUAGE:-en}
      ID_MIGRATION_APPS: ${ID_MIGRATION_APPS:-}
      ENABLE_TUTORING: "true"
    volumes:
      - './volumes/config/openedx/www:/openedx/www'
      - './volumes/data/openedx:/openedx/data'
    depends_on:
      db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'
      - 'traefik.http.routers.openedx-server.entrypoints=http'
      - 'traefik.http.routers.openedx-server.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.openedx-server.middlewares=openedx-server-https-redirect'
      - 'traefik.http.middlewares.openedx-server-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.openedx-server-secure.entrypoints=https'
      - 'traefik.http.routers.openedx-server-secure.rule=Host(`${BASE_HOST_NAME:-$HOSTNAME}`)'
      - 'traefik.http.routers.openedx-server-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.openedx-server-secure.service=openedx-server'
      - 'traefik.http.services.openedx-server.loadbalancer.server.port=8000'
    networks:
      - openedx
      - traefik

  db:
    image: mongo:latest
    container_name: openedx-db
    hostname: openedx-db
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: openedx-db
      MONGO_INITDB_ROOT_USERNAME: ${DB_ADMIN_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_ADMIN_PASS:-changeme_admin_password}
      MONGO_INITDB_DATABASE: ${DB_CREATE_DATABASE_NAME:-openedx}
    volumes:
      - './volumes/db/mongo/openedx:/data/db:z'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - openedx

networks:
  openedx:
    name: openedx
    external: false
  traefik:
    external: true
